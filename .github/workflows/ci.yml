name: gate-001-ci

on:
  push:
    branches: [ main, "gate-*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swiss_garden_jobs
          POSTGRES_USER: swiss_garden_jobs
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swiss_garden_jobs -d swiss_garden_jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-${{ github.sha }}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      POSTGRES_DB: swiss_garden_jobs
      POSTGRES_USER: swiss_garden_jobs
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      JOB_OBSERVATORY_RAW_STORE_PATH: ./data/raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Migrate clean PostgreSQL database
        run: python manage.py migrate --noinput
      - name: Import frozen reference data
        run: python manage.py import_reference_data
      - name: Verify PostgreSQL backend
        run: >-
          python manage.py shell -c
          "from django.db import connection;
          connection.ensure_connection();
          assert connection.vendor == 'postgresql', connection.vendor;
          print('Database backend:', connection.vendor)"
      - name: Run lint
        run: make lint
      - name: Run type check
        run: make typecheck
      - name: Run tests
        run: make test
